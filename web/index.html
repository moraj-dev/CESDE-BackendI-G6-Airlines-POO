<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airlines-poo · Centro de Control</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <aside id="sidebar" class="sidebar">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">✈</div>
                <div>
                    <div class="brand-title">Airlines-poo</div>
                    <div class="brand-sub">Grupo 6 · Operaciones</div>
                </div>
            </div>

            <nav class="nav-list" aria-label="Navegación principal">
                <button class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </button>
                <div class="nav-section">Módulos</div>
                <button class="nav-item" data-view="customers">
                    <span class="nav-icon">👥</span>
                    <span>Clientes</span>
                </button>
                <button class="nav-item" data-view="locations">
                    <span class="nav-icon">📍</span>
                    <span>Ubicaciones</span>
                </button>
                <button class="nav-item" data-view="airlines">
                    <span class="nav-icon">🏢</span>
                    <span>Aerolíneas</span>
                </button>
                <button class="nav-item" data-view="flights">
                    <span class="nav-icon">🛫</span>
                    <span>Vuelos</span>
                </button>
                <button class="nav-item" data-view="reservations">
                    <span class="nav-icon">🎫</span>
                    <span>Reservas</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="db-chip">SQL Server · AerolinesPoo</div>
                <div class="java-chip">Java 21 HTTP API</div>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <button id="menu-toggle" class="icon-btn mobile-only" aria-label="Abrir menú">☰</button>
                    <div>
                        <h1 id="page-title" class="page-title">Dashboard Ejecutivo</h1>
                        <p id="page-subtitle" class="page-subtitle">Resumen operativo en tiempo real</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <div id="connection-pill" class="status-pill status-checking">
                        <span class="status-dot"></span>
                        <span id="connection-text">Conectando...</span>
                    </div>
                    <button id="refresh-btn" class="btn btn-secondary btn-sm" title="Actualizar vista actual">
                        ↻ Actualizar
                    </button>
                </div>
            </header>

            <main id="view-container" class="view-container"></main>
        </div>
    </div>

    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title"></h2>
                <button id="modal-close" class="icon-btn" aria-label="Cerrar">✕</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/customers.js"></script>
    <script src="js/locations.js"></script>
    <script src="js/airlines.js"></script>
    <script src="js/flights.js"></script>
    <script src="js/reservations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
